services:
  - type: web
    name: my-bot-lucky
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
