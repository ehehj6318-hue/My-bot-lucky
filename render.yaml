services:
  - type: web
    name: lucky-auto-token-bot
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEFAULT_ADMIN
        value: 8633088314
      - key: SUPER_ADMINS
        value: 8633088314,7981894574
      - key: DATA_FILE
        value: bot_data.json
      - key: PYTHON_VERSION
        value: 3.11.9
